device:
  type: adb
  adb_host: 127.0.0.1
  adb_port: 7555

schedule:
  daily_time: "06:00"
  interval_tasks: []

execution:
  step_timeout: 30
  game_timeout: 1800
  max_retries: 3

paths:
  screenshot_dir: ./screenshots/
  log_dir: ./logs/

games:
  - name: "崩坏：星穹铁道"
    config: games/hsr/config.yaml
    enabled: true
  - name: "异环"
    config: games/yihuan/config.yaml
    enabled: true
  - name: "明日方舟：终末地"
    config: games/zhongmodi/config.yaml
    enabled: true
  - name: "火影忍者"
    config: games/naruto/config.yaml
    enabled: true
