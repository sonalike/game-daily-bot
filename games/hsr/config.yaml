# 崩坏：星穹铁道 — 完整日常流程
# 流程: 进入游戏 → 菜单栏(邮箱→委托→指南打本) → 指南领奖 → 退出
# 修改步骤: 直接编辑 steps 列表即可
#
# 步骤类型:
#   tap_asset: 图名    找图+点击
#   wait_asset: 图名   等图出现
#   wait_gone: 图名    等图消失(加载)
#   wait: 秒数         纯等待
#   press_esc          按Esc
#   check: 图名        分支判断(on_found/on_not_found: ok|skip|fail|continue)
#
# 参数: timeout(超时秒) optional(true=找不到跳过) jitter(点击偏移像素)

game:
  name: "崩坏：星穹铁道"

tasks:

  # ═══════════════════════════════════════════
  # 1. 进入游戏
  # ═══════════════════════════════════════════
  enter_game:
    enabled: true
    priority: 1
    description: "进入游戏"
    steps:
      # 主界面 → 点击"进入游戏"
      - tap_asset: "enter_game_btn"
        timeout: 10
      # 等待角色操作界面加载
      - wait_gone: "loading_screen"
        timeout: 60
      - wait: 2

  # ═══════════════════════════════════════════
  # 2. 领取邮件
  # ═══════════════════════════════════════════
  claim_mail:
    enabled: true
    priority: 2
    description: "领取邮件"
    steps:
      # 角色界面 → Esc → 菜单栏
      - press_esc
      - wait_asset: "menu_panel"
        timeout: 5
      # 点击邮箱按钮
      - tap_asset: "menu_mail_btn"
        timeout: 5
        jitter: 3
      # 等邮箱界面加载
      - wait_gone: "loading_screen"
        timeout: 10
      - wait_asset: "mail_claim_all_highlight"
        timeout: 5
      # 点击全部领取 (高亮=有邮件, 透明=无邮件)
      - tap_asset: "mail_claim_all_highlight"
        timeout: 3
        jitter: 3
        optional: true
      - wait: 1

  # ═══════════════════════════════════════════
  # 3. 委托
  # ═══════════════════════════════════════════
  assignments:
    enabled: true
    priority: 3
    description: "委托领取"
    steps:
      # 从邮箱界面 → Esc → 菜单栏
      - press_esc
      - wait_asset: "menu_panel"
        timeout: 5
      # 点击委托按钮
      - tap_asset: "menu_assign_btn"
        timeout: 5
        jitter: 3
      # 等委托界面加载
      - wait_gone: "loading_screen"
        timeout: 10
      # 点击领取奖励
      - tap_asset: "assign_claim_btn"
        timeout: 5
        jitter: 3
      # 点击空白处关闭领取窗口
      - tap_asset: "assign_close_area"
        timeout: 3
        jitter: 10
        optional: true
      - wait: 0.5

  # ═══════════════════════════════════════════
  # 4. 清体力 (指南 → 角色培养 → 打本 → 循环)
  # ═══════════════════════════════════════════
  spend_stamina:
    enabled: true
    priority: 4
    description: "清体力打本"
    steps:
      # 委托界面 → Esc → 菜单栏
      - press_esc
      - wait_asset: "menu_panel"
        timeout: 5
      # 点击星际和平指南
      - tap_asset: "menu_guide_btn"
        timeout: 5
        jitter: 3
      # 等指南界面加载
      - wait_gone: "loading_screen"
        timeout: 10
      # 点击角色培养按钮
      - tap_asset: "guide_char_train_btn"
        timeout: 5
        jitter: 3
      # 找到培养目标 → 点击"进入"按钮
      - wait_asset: "char_train_enter_btn"
        timeout: 5
      - tap_asset: "char_train_enter_btn"
        timeout: 5
        jitter: 3
      # 等副本选关界面加载
      - wait_gone: "loading_screen"
        timeout: 10
      - wait_asset: "dungeon_select_screen"
        timeout: 10
      # 点击挑战
      - tap_asset: "dungeon_challenge_btn"
        timeout: 5
        jitter: 3
      # 等队伍配置界面 → 点击开始挑战
      - wait_gone: "loading_screen"
        timeout: 10
      - wait_asset: "team_start_btn"
        timeout: 5
      - tap_asset: "team_start_btn"
        timeout: 5
        jitter: 3
      # 等战斗界面 → 点自动战斗
      - wait_gone: "loading_screen"
        timeout: 30
      - wait_asset: "battle_auto_btn"
        timeout: 10
      - tap_asset: "battle_auto_btn"
        timeout: 3
        jitter: 5
      # 等待战斗结束 (最长5分钟)
      - wait_asset: "battle_victory_screen"
        timeout: 300
      # 点击退出关卡
      - tap_asset: "exit_stage_btn"
        timeout: 5
        jitter: 3
      # 等返回副本选关界面
      - wait_gone: "loading_screen"
        timeout: 10
      # 返回
      - press_esc
      - wait: 0.5

  # ═══════════════════════════════════════════
  # 5. 指南每日奖励
  # ═══════════════════════════════════════════
  guide_daily_rewards:
    enabled: true
    priority: 5
    description: "指南每日奖励"
    steps:
      # 副本界面 → Esc → 角色界面 → Esc → 菜单栏
      - press_esc
      - wait: 0.5
      - press_esc
      - wait_asset: "menu_panel"
        timeout: 5
      # 点击星际和平指南
      - tap_asset: "menu_guide_btn"
        timeout: 5
        jitter: 3
      # 等指南加载
      - wait_gone: "loading_screen"
        timeout: 10
      # 点击下方领取奖励 (只点第一个, 自动排序)
      - tap_asset: "guide_bottom_claim_btn"
        timeout: 5
        jitter: 5
      # 依次点击5个奖励档位 (100 200 300 400 500)
      - tap_asset: "guide_reward_tier1"
        timeout: 3
        jitter: 5
      - tap_asset: "guide_reward_tier2"
        timeout: 3
        jitter: 5
      - tap_asset: "guide_reward_tier3"
        timeout: 3
        jitter: 5
      - tap_asset: "guide_reward_tier4"
        timeout: 3
        jitter: 5
      - tap_asset: "guide_reward_tier5"
        timeout: 3
        jitter: 5
      - wait: 0.5

  # ═══════════════════════════════════════════
  # 6. 退出 (返回角色操作界面)
  # ═══════════════════════════════════════════
  return_to_game:
    enabled: true
    priority: 6
    description: "返回角色界面"
    steps:
      - press_esc
      - wait: 0.5
      - press_esc
      - wait: 0.5
